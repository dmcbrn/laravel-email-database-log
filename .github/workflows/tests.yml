name: tests

on:
  push:
  pull_request:
  # Every Monday at 04:37 UTC, so a new Laravel release that breaks the package is noticed
  # even when nobody pushes. GitHub pauses this after 60 days without activity in the repository.
  schedule:
    - cron: '37 4 * * 1'
  # A "Run workflow" button in the Actions tab, to run the tests by hand.
  workflow_dispatch:

env:
  # Recent Composer versions refuse package versions with known security advisories, which
  # older Laravel 13 releases have. These are test runs, not a real app.
  COMPOSER_NO_BLOCKING: 1
  COMPOSER_NO_SECURITY_BLOCKING: 1

jobs:
  # In-memory SQLite: every supported PHP version, with the oldest and newest dependency versions.
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: ['lowest', 'highest']

    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }} dependencies

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo, dom, curl, pdo_sqlite, sqlite3
          coverage: none

      - name: Install the newest allowed versions
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Install the oldest allowed versions
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  # MySQL: the oldest version Laravel 13 supports.
  mysql:
    runs-on: ubuntu-latest
    name: MySQL 5.7 / PHP 8.5

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: email_log_tests
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, fileinfo, dom, curl, pdo_mysql
          coverage: none

      - name: Install the newest allowed versions
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          EMAIL_LOG_TEST_DB_CONNECTION: mysql
          EMAIL_LOG_TEST_DB_HOST: 127.0.0.1
          EMAIL_LOG_TEST_DB_PORT: 3306
          EMAIL_LOG_TEST_DB_DATABASE: email_log_tests
          EMAIL_LOG_TEST_DB_USERNAME: root
          EMAIL_LOG_TEST_DB_PASSWORD: password

  # PostgreSQL: the oldest version Laravel 13 supports.
  pgsql:
    runs-on: ubuntu-latest
    name: PostgreSQL 10 / PHP 8.5

    services:
      postgres:
        image: postgres:10
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: email_log_tests
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, fileinfo, dom, curl, pdo_pgsql
          coverage: none

      - name: Install the newest allowed versions
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          EMAIL_LOG_TEST_DB_CONNECTION: pgsql
          EMAIL_LOG_TEST_DB_HOST: 127.0.0.1
          EMAIL_LOG_TEST_DB_PORT: 5432
          EMAIL_LOG_TEST_DB_DATABASE: email_log_tests
          EMAIL_LOG_TEST_DB_USERNAME: postgres
          EMAIL_LOG_TEST_DB_PASSWORD: password
