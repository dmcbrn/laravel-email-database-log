name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2']
        dependencies: ['lowest', 'highest']

    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }} dependencies

    env:
      # Laravel 9 is end-of-life, and recent Composer versions refuse packages with known
      # security advisories. These are test runs, not a real app.
      COMPOSER_NO_BLOCKING: 1
      COMPOSER_NO_SECURITY_BLOCKING: 1

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo, dom, curl, pdo_sqlite, sqlite3
          coverage: none

      - name: Install the newest allowed versions
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Install the oldest allowed versions
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
